<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أطلس مسارات مايكرو — Micro User Flow Atlas</title>
<style>
:root{
  --bg:#faf9f5; --panel:#ffffff; --ink:#231f1a; --mut:#6f6a60; --line:#ddd6ca;
  --accent:#cc785c; --ok:#2f7d4f; --warn:#a06a18; --plan:#3b6fa0; --bad:#b3452f;
  --radius:14px; --shadow:0 1px 3px rgba(35,31,26,.08),0 8px 24px rgba(35,31,26,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Noto Sans Arabic","Noto Sans",Tahoma,Arial,sans-serif;line-height:1.55}
button{font:inherit}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:15px;white-space:nowrap}
.brand b{color:var(--accent)}
#searchInput{flex:1;min-width:120px;max-width:560px;margin-inline:auto;border:1.5px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:14px;background:var(--bg)}
#searchInput:focus{outline:2px solid var(--accent);outline-offset:1px}
.icon-btn{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;
  min-width:38px;height:38px;cursor:pointer;font-size:16px}
.icon-btn:hover{border-color:var(--accent)}
.layout{display:flex;min-height:calc(100vh - 59px)}
#sidebar{width:248px;flex:0 0 248px;background:var(--panel);border-inline-start:0;
  border-inline-end:1px solid var(--line);padding:12px 10px 40px;overflow-y:auto;position:sticky;
  top:59px;height:calc(100vh - 59px)}
#sidebar h3{margin:14px 8px 4px;font-size:12px;color:var(--mut);letter-spacing:.4px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;
  background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13.5px}
.navbtn:hover{background:var(--bg)}
.navbtn[aria-current="true"]{background:#f6e9e2;color:#8a4a30;font-weight:700}
.navbtn .cnt{color:var(--mut);font-size:11px}
#main{flex:1;min-width:0;padding:18px 20px 60px;max-width:1100px}
#details{position:fixed;inset-inline-start:0;top:59px;bottom:0;width:400px;max-width:92vw;
  background:var(--panel);border-inline-end:1px solid var(--line);box-shadow:var(--shadow);
  z-index:30;overflow-y:auto;padding:14px 16px 40px}
#details[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--accent)}
.stat span{font-size:11.5px;color:var(--mut)}
h1{font-size:20px;margin:6px 0 10px}
h2{font-size:16px;margin:18px 0 8px}
h3{font-size:14px}
.chip{display:inline-block;border:1.5px solid;border-radius:999px;padding:1px 10px;
  font-size:11px;font-weight:700;margin-inline-end:6px;white-space:nowrap}
.st-IMPLEMENTED{color:var(--ok);border-color:var(--ok)}
.st-PARTIALLY_IMPLEMENTED{color:var(--warn);border-color:var(--warn)}
.st-PLANNED_OR_CONCEPTUAL{color:var(--plan);border-color:var(--plan)}
.st-NOT_FOUND{color:var(--mut);border-color:var(--mut)}
.st-CONFLICTING{color:var(--bad);border-color:var(--bad)}
.st-UNVERIFIABLE_FROM_REPOSITORY{color:#7a5aa0;border-color:#7a5aa0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:start;border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:11.5px}
tr:hover td{background:#fbf7f1}
td a, .link{color:var(--accent);cursor:pointer;text-decoration:underline;word-break:break-word}
.evi{font-size:11.5px;color:var(--mut);direction:ltr;text-align:left;unicode-bidi:plaintext;
  word-break:break-word}
.field{margin:6px 0}
.field b{color:var(--ink)}
.field .lbl{display:inline-block;min-width:120px;color:var(--mut);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.toolbar button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;
  padding:6px 12px;cursor:pointer;font-size:13px}
.toolbar button:hover{border-color:var(--accent)}
.svgwrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);
  overflow:hidden;touch-action:none;cursor:grab}
.svgwrap:active{cursor:grabbing}
.svgwrap svg{display:block;width:100%;height:auto;min-height:220px}
.dg-node{cursor:pointer}
.dg-node:hover rect,.dg-node:hover path,.dg-node:hover polygon,.dg-node:hover circle{filter:brightness(.96)}
.closebtn{position:absolute;inset-inline-end:10px;top:10px;border:0;background:none;font-size:20px;cursor:pointer}
#details .head{position:sticky;top:0;background:var(--panel);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;z-index:2}
.backlink{font-size:12.5px;color:var(--mut);cursor:pointer;margin-bottom:6px;display:inline-block}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.filters button{border:1.5px solid var(--line);border-radius:999px;background:var(--panel);
  padding:3px 12px;font-size:12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.legend-item{display:flex;align-items:center;gap:10px;font-size:12.5px}
.legend-item svg{flex:0 0 64px}
.meta-panel{position:fixed;inset:0;background:rgba(35,31,26,.45);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px}
.meta-panel[hidden]{display:none}
.meta-card{background:var(--panel);border-radius:16px;max-width:640px;width:100%;
  max-height:85vh;overflow-y:auto;padding:20px 22px;box-shadow:var(--shadow)}
.toast{position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(50%);
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:13px;z-index:70;
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.tocat{font-size:11px;color:var(--mut)}
details.acc{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--panel)}
details.acc summary{padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px}
details.acc .body{padding:0 12px 10px}
.empty{color:var(--mut);padding:20px;text-align:center}
@media (max-width:920px){
  #sidebar{position:fixed;inset-inline-start:0;top:59px;bottom:0;z-index:35;height:auto;
    transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow);width:260px}
  html[dir="rtl"] #sidebar{transform:translateX(105%)}
  #sidebar.open{transform:translateX(0)}
  #main{padding:14px 12px 50px}
  #details{top:auto;bottom:0;width:100%;height:64vh;border-inline-end:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0}
  .brand{font-size:13px}
}
@media print{
  .topbar,#sidebar,#details,.toolbar,.toast,.backlink,#navToggle{display:none!important}
  #main{width:100%;max-width:none;padding:0}
  .svgwrap{border:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

تطبيق محلي أولًا: واجهة React عربية RTL فوق خدمات تطبيق وسياسات مجالية نقية فوق مخزن IndexedDB واحد على الجهاز. لا شبكة، لا سحابة، لا مزامنة في هذه النسخة. القفل المحلي وقشرة PWA يحيطان بالكل.", "desc_en": "Offline-first local architecture: RTL React UI over application services over pure domain policies over one IndexedDB store. Zero network calls."}, {"id": "DGM-02", "title_ar": "خريطة الفاعلين والصلاحيات", "title_en": "Actor & Permission Map", "category": "actors", "desc_ar": "المالك هو الفاعل البشري الوحيد داخل التطبيق. العميل والمورد والشركة بيانات خارجية فقط. المساعد اليوم توجيه حتمي لا يكتب الحقيقة المالية. الأدوار الشبكية (موظف/مندوب/مشرف) مفهوم مخطط في عقود التوسعة فقط.", "desc_en": "Single local human actor; customers/suppliers/couriers are data subjects; deterministic guidance; network roles are contract-only."}, {"id": "DGM-03", "title_ar": "خريطة المجال", "title_en": "Domain Map", "category": "domain", "desc_ar": "أربع عشرة وحدة مجالية نقية. الطلب الحرفي هو المحرك المركزي؛ الحدث المالي هو دفتر الأستاذ العام بـ١٧ نوعًا و٨ أبعاد مالية موقّعة. المخزون والنقد والمالك أموال منفصلة لا تختلط.", "desc_en": "14 pure domain modules; craft-order engine at the center; 17-type financial-event ledger with 8 signed delta dimensions."}, {"id": "DGM-04", "title_ar": "خريطة الشاشات والتنقل", "title_en": "Screen & Navigation Map", "category": "navigation", "desc_ar": "أربعة تبويبات سفلية («مشروعي الآن»، «العمل»، «مالي»، «أدواتي») وزر «سجّل» في المنتصف يفتح ٥ أفعال سريعة. القارئ سطح يحافظ على التبويبات؛ المحرر عمق يخفيها ويحمي المدخلات. كل مسار عميق يحمل «?from» للرجوع لمصدره.", "desc_en": "4 bottom tabs + central FAB with 5 quick actions; reader=surface (keeps nav), editor=depth (hides nav, guards input); ?from referrer contract."}, {"id": "DGM-05", "title_ar": "ممر السباحة: دورة الطلب حتى التسليم", "title_en": "Swimlane: Order to Delivery", "category": "swimlane", "desc_ar": "تفاعل المالك مع النظام عبر دورة الطلب: مسودة → اتفاق (+عربون سيولة) → تنفيذ → جاهز → مراجعة تسليم (استهلاك مقترح + قبض اختياري) → تسليم يعرف الإيراد مرة واحدة. الاستثناءات: نقص مواد، حاجز معرفة، فشل تخزين — كل شيء أو لا شيء.", "desc_en": "Owner×system swimlane of the order lifecycle; revenue recognized once at delivery; exceptions are honest and atomic."}, {"id": "DGM-06", "title_ar": "ممر السباحة: الإدخال المالي الموجّه والتصحيح", "title_en": "Swimlane: Guided Entry & Correction", "category": "swimlane", "desc_ar": "المساعد الحتمي (توجيه + معاينة أثر مشتقة من نفس دالة الحفظ) لا يكتب شيئًا. المالك يقرر؛ النظام يكتب حدثًا مجاليًا، والتصحيح لاحقًا = عكس موثق + استبدال في معاملة واحدة (النص الأصلي يبقى).", "desc_en": "Deterministic guidance previews from the same expansion as save; corrections are atomic reverse-and-replace pairs."}, {"id": "DGM-07", "title_ar": "ممر السباحة: شراء المورد والاستلام", "title_en": "Swimlane: Supplier Purchase & Receipt", "category": "swimlane", "desc_ar": "المورد فاعل بيانات خارجي (لا بوابة). الشراء يخرج كاشًا أو ينشئ ذممًا — ليس مصروفًا ولا تكلفة حتى الاستهلاك. جسر الاستلام يفتح محرر استلام معبأ مسبقًا بلا كتابة صامتة، والاستلام مقيّد بحدود الشراء.", "desc_en": "Supplier is a data subject; purchase = cash/payable only; receipt bridge is pre-filled, bounded, never silent."}, {"id": "DGM-08", "title_ar": "ممر السباحة: النسخ الاحتياطي والاستعادة والقفل", "title_en": "Swimlane: Backup, Restore & Lock", "category": "swimlane", "desc_ar": "التصدير الموثق يُعاد تحليله قبل النجاح؛ الاستيراد يرفض ١١ نوعًا من الملفات التالفة قبل أي معاينة، والاستبدال معاملة واحدة. إجراءات خروج البيانات (تصدير/استيراد/مسح) تتطلب إثبات رمز مرة واحدة للجلسة.", "desc_en": "Verified export (round-trip), 11 honest import rejection rules, atomic replace; data-exit actions PIN-gated once per session."}, {"id": "DGM-09", "title_ar": "حالة الطلب", "title_en": "State: CraftOrder", "category": "state", "desc_ar": "آلة حالات الطلب العشر. الإيراد يُعرف مرة واحدة عند «تم التسليم». عكس التسليم يعيد الطلب إلى «يحتاج مراجعة» مع إيراد مُحيَّد؛ الاستئناف يعيد إلى «اتفاق مبدئي/مؤكد»؛ الإلغاء مسموح قبل التسليم فقط (ومن «يحتاج مراجعة» إن اكتمل بأمان).", "desc_en": "10-state machine; recognition once at delivered; reversal→needs_review; resume; cancel pre-delivery only."}, {"id": "DGM-10", "title_ar": "حالة تسوية العربون عند الإلغاء", "title_en": "State: Deposit Settlement", "category": "state", "desc_ar": "عربون الطلب الملغى: «يحتاج مراجعة» هو الوضع الآمن الافتراضي. الرد يعيد الكاش ويعكس تخصيصات المحفظة (كاملة/جزئية)؛ الاحتفاظ يبقي الكاش ثم تصنيف صريح: مال مالك أو إيراد مرة واحدة. المبالغ الجزئية تبقي حالة معلّقة حتى لا يبقى شيء.", "desc_en": "cancelled_pending → refund/retain (partial allowed) → explicit classification; final state only when nothing pending."}, {"id": "DGM-11", "title_ar": "حالة البيع المباشر", "title_en": "State: DirectSale", "category": "state", "desc_ar": "البيع المباشر يُعرف إيراده بتاريخ البيع. الفرق بين المقبوض والقيمة قرار صريح: دين جزئي أو «يحتاج مراجعة». التصحيح ثلاثي: تعديل (يحفظ القيمة قبل)، تخفيض سعر (الإيراد = المقبوض فعليًا)، إلغاء (يُستبعد ويعكس التخصيصات مرآةً).", "desc_en": "Revenue at sale date; explicit difference decision; three documented correction kinds; cancel mirror-reverses allocations."}, {"id": "DGM-12", "title_ar": "نموذج تصحيح الحدث المالي", "title_en": "State: Financial Event Correction", "category": "state", "desc_ar": "كل تصحيح حدث مالي = سجل تراجع جديد بمعاملات معكوسة يشير للأصل؛ الأصل لا يُمس أبدًا. التراجع عن التراجع ممنوع. التعديل = زوج (عكس + استبدال) في معاملة واحدة؛ التراجع عن التصحيح (استعادة) يعيد القيم الأصلية كسجل جديد.", "desc_en": "Reversal events negate sources; originals immutable; reversals never reversed; edit = atomic pair; restore = new copy."}, {"id": "DGM-13", "title_ar": "حركة المخزون والنقص", "title_en": "State: Inventory Movement & Shortage", "category": "state", "desc_ar": "الحركات الاتجاهية مضمونة (استلام/افتتاح يزيد؛ استهلاك/هدر ينقص). الرصيد السالب مستحيل: الطلب فوق المتاح يسجل «نقصًا» صريحًا أو «استهلك المتاح + نقص» ذريًا. الهدر قد يمس الربح (حدث خسارة غير نقدي) أو يبقى إفصاحًا فقط — قرار المالك.", "desc_en": "Direction-guarded movements; negative impossible (shortage ledger); waste profit-impact is an explicit owner choice."}, {"id": "DGM-14", "title_ar": "حالة الأصل", "title_en": "State: Asset", "category": "state", "desc_ar": "الاقتناء رأسمال لا مصروف. الإهلاك مقترح جدولة حتى تسجيل صريح؛ الجدول الكامل يجعل الدفتري صفرًا والأصل يبقى نشطًا مستخدمًا. التخلص/الشطب حدثان منفصلان يجمدان القيمة الدفترية، وبعدهما يُرفض عكس الإهلاك (AV-08) حتى لا تُبعث قيمة لاغية.", "desc_en": "Acquisition=capital; depreciation proposal→explicit; to-zero stays active; disposal/write-off freeze; post-disposal reversal rejected."}, {"id": "DGM-15", "title_ar": "حالة القرض", "title_en": "State: Loan", "category": "state", "desc_ar": "القرض ليس مصروفًا ولا سحب مالك؛ السداد ليس دخلًا. المتبقي مشتق من السدادات النشطة دائمًا. التصحيح = عكس واستبدال ذريين لحدث الأصل، وحارس التزامن يرفض الكتابات المتقادمة.", "desc_en": "Loans are neither expense nor owner draw; outstanding derived; corrections atomic; concurrency guard."}, {"id": "DGM-16", "title_ar": "حالة دفعات الشراء", "title_en": "State: SupplierPurchase Payments", "category": "state", "desc_ar": "الحالة مشتقة من «المدفوع الفعلي = الدفعات − العكوس الموثقة». الدفعة الأولية تُصحح عبر تعديل الشراء الموثق (بقيم قبل)؛ الدفعات اللاحقة فقط قابلة للعكس، وعكس واحد لكل دفعة. التعديل لا يهبط بالإجمالي دون الاستلامات الموثقة.", "desc_en": "Status derived from effective payments; initial payment corrected via edit; later payments reversible once each."}, {"id": "DGM-17", "title_ar": "المخطط الخدمي: التسليم مع التحصيل", "title_en": "Service Blueprint: Delivery with Collection", "category": "blueprint", "desc_ar": "فصل الأفعال المرئية للمالك عن أفعال النظام عن التخزين عن الأثر المالي. صف التسليم الحرج: إجراء واحد ذري يضم انتقال الحالة + الإيراد مرة واحدة + استهلاك المواد + قبضًا اختياريًا + تسوية المواعيد.", "desc_en": "User actions vs system actions vs persistence vs financial effect, for the critical delivery-with-collection line."}, {"id": "DGM-18", "title_ar": "التدفق الحرج: عربون → تسليم → متبقٍ", "title_en": "Critical Flow: Deposit → Delivery → Remainder", "category": "critical", "desc_ar": "المسار المالي الأهم (مثال ١٠٠/٢٠/٨٠): العربون سيولة مرتبطة بالطلب والمحفظة قبل التسليم؛ عند التسليم بيع واحد بالقيمة كاملة والعربون يُطبق مرة واحدة داخله؛ تحصيل المتبقي كاش فقط لا إيراد جديد.", "desc_en": "The 100/20/80 path: deposit=liquidity; one full sale at delivery applying deposit once; remainder=cash only."}, {"id": "DGM-19", "title_ar": "التدفق الحرج: إلغاء طلب فيه عربون", "title_en": "Critical Flow: Cancel with Deposit", "category": "critical", "desc_ar": "القرار E: معاينة أثر إلزامية قبل أي شيء (عربون، محفظة المصدر، مواد وتكلفة، أثر الربح، مالك/مشروع). ثم الرد يعكس تخصيصات المحفظة بحدود المبلغ، والاحتفاظ يبقي الكاش في انتظار تصنيف صريح (مال مالك أو إيراد مرة واحدة) — لا تصنيف تلقائي أبدًا.", "desc_en": "Mandatory impact preview; refund reverses allocations; retention awaits explicit meaning; never auto-classified."}, {"id": "DGM-20", "title_ar": "التدفق الحرج: التصحيح الآمن", "title_en": "Critical Flow: Safe Correction", "category": "critical", "desc_ar": "أفعال المالك الثلاثة (تعديل/حذف/تراجع) كلها محرك واحد: عكس موثق (+ استبدال عند التعديل) في معاملة واحدة. المعاينة بلغة النتيجة قبل التأكيد؛ تصحيح تصنيف المصروف يمر بنفس المسار؛ أحداث العائلات (أصل/قرض/عربون) تُصحح من أسطحها.", "desc_en": "Three owner verbs, one engine: documented reversal (+ replacement) atomic; preview in result language; family events corrected at their surfaces."}, {"id": "DGM-21", "title_ar": "التدفق الحرج: الهدر بالخيار", "title_en": "Critical Flow: Waste with Choice", "category": "critical", "desc_ar": "الهدر حركة كمية قيمية سياقها إلزامي؛ خيار «يمس الربح» يُخزن في الحركة نفسها. مع تكلفة معروفة: حدث خسارة غير نقدية يُكتب مع الحركة في معاملة واحدة؛ مع تكلفة مجهولة: الخيار يبقى دون مساس بالنتيجة. العكس يعكس الاثنين معًا.", "desc_en": "wasteProfitImpact choice stored on movement; known cost ⇒ atomic loss event; unknown cost keeps the choice only; reversal reverses both."}, {"id": "DGM-22", "title_ar": "التدفق الحرج: استعادة النسخة — الرفض والنجاح", "title_en": "Critical Flow: Restore Rejection & Success", "category": "critical", "desc_ar": "المسار الصادق: تحليل + قائمة أزواج إصدارات + بصمة سلامة + عدادات + تحقق عميق (بما فيه الأيتام العائلية). أي فشل = رفض قبل أي معاينة والجهاز لم يُمس. النجاح = معاينة «ما سيُستبدل» ثم تأكيد برمز ثم استبدال ذري وفحص سلامة.", "desc_en": "Parse → allowlist → digest → counts → deep validation; failures reject before preview; success = PIN-gated atomic replace + integrity check."}, {"id": "DGM-23", "title_ar": "التدفق الحرج: قرار المخزون السالب", "title_en": "Critical Flow: Negative Inventory Decision", "category": "critical", "desc_ar": "الطلب فوق المتاح لا يُخزن أبدًا كسالب: يُرفض مباشرة ثم يُعرض قرار صريح — سجّل نقصًا فقط، أو استهلك المتاح وسجّل النقص (ذري)، أو تجاوز. النقص المفتوح شارة + MIC-8 تحذير، ويُحسم لاحقًا صراحةً.", "desc_en": "Guard rejects; explicit choice: shortage-only / consume-available+shortage (atomic) / skip; open shortage badge + MIC-8."}, {"id": "DGM-24", "title_ar": "خريطة التقاطع بين المسارات", "title_en": "Cross-Flow Entity Reuse Map", "category": "crossflow", "desc_ar": "أين تلتقي المسارات: الطلب يستهلك المواد ويقبل العربون ويولّد الإيراد؛ التحصيل يخدم الطلبات والمبيعات الآجلة ويخصص الكاش؛ الحدث المالي يجمع العربون المصنف والأصول والقروض والمصاريف؛ دفتر الناس يقرأ الكل بالاسم.", "desc_en": "Where journeys share entities: orders↔materials↔cash; collections serve orders+sales; events carry deposits/assets/loans; parties read all."}, {"id": "DGM-25", "title_ar": "خريطة الفجوات والتناقضات", "title_en": "Gap & Contradiction Map", "category": "gap", "desc_ar": "فجوات مصنفة بالشدة والأثر: تناقضات التوثيق (خطة مؤجلة متقادمة، تصادم أرقام العقود ١٨–٢٣)، غير منفذ بالتصميم (سوق/توصيل/POS/مزامنة)، ونقص قابل للتحسين (دمج أسماء الجهات، مسار تعديل الاتفاق بانتظار قرار §5-18).", "desc_en": "Docs contradictions, by-design de "use strict";
const M = DATA.metadata;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.prototype.slice.call((el || document).querySelectorAll(s));

const STATUS_AR = {
  IMPLEMENTED: "منفذ",
  PARTIALLY_IMPLEMENTED: "منفذ جزئيًا",
  PLANNED_OR_CONCEPTUAL: "مخطط/مفهومي",
  NOT_FOUND: "غير موجود",
  CONFLICTING: "متعارض",
  UNVERIFIABLE_FROM_REPOSITORY: "غير قابل للتحقق"
};

const COLL = [
  {key: "flows", label: "المسارات (رحلات المستخدم)", one: "مسار"},
  {key: "screens", label: "الشاشات", one: "شاشة"},
  {key: "features", label: "القدرات", one: "قدرة"},
  {key: "services", label: "الخدمات", one: "خدمة"},
  {key: "entities", label: "الكيانات", one: "كيان"},
  {key: "actors", label: "الفاعلون", one: "فاعل"},
  {key: "states", label: "الحالات", one: "حالة"},
  {key: "transitions", label: "الانتقالات", one: "انتقال"},
  {key: "scenarios", label: "السيناريوهات", one: "سيناريو"},
  {key: "gaps", label: "الفجوات", one: "فجوة"},
  {key: "decisions", label: "القرارات", one: "قرار"},
  {key: "traceability", label: "التتبع العقدي", one: "سطر تتبع"},
  {key: "diagrams", label: "المخططات", one: "مخطط"}
];

const REC = new Map();
COLL.forEach(function (c) {
  (DATA[c.key] || []).forEach(function (r) { REC.set(r.id, {coll: c, rec: r}); });
});
(DATA.diagram_nodes || []).forEach(function (n) { REC.set(n.id, {coll: {key: "diagram_nodes", one: "عقدة مخطط", label: "عقد المخططات"}, rec: n}); });

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function chip(status) {
  return '<span class="chip st-' + status + '">' + (STATUS_AR[status] || status) + "</span>";
}
function nameOf(id) {
  var e = REC.get(id);
  if (!e) return id;
  var r = e.rec;
  return r.name_ar || r.title_ar || r.label_ar || r.name_en || r.title_en || r.title || r.id;
}
function linkTo(id, text) {
  return '<a class="link" data-id="' + esc(id) + '">' + esc(text || nameOf(id)) + "</a>";
}
function idLinks(ids) {
  if (!ids || !ids.length) return "—";
  return ids.map(function (i) { return linkTo(i); }).join("، ");
}
function evid(e) {
  if (!e || !e.length) return "";
  return '<div class="field"><span class="lbl">الأدلة:</span><div class="evi">' +
    e.map(esc).join("<br>") + "</div></div>";
}
function toast(msg) {
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, 1800);
}

/* ---------------- navigation ---------------- */
function nav() {
  var sb = $("#sidebar");
  var html = '<h3>نظرة عامة</h3>';
  html += btn("#/", "لوحة البداية");
  html += btn("#/diagrams", "أطلس المخططات", (DATA.diagrams || []).length);
  html += btn("#/legend", "دليل الرموز");
  html += btn("#/textindex", "الفهرس النصي");
  html += "<h3>الكتالوجات</h3>";
  COLL.forEach(function (c) {
    if (c.key === "diagrams") return;
    html += btn("#/catalog/" + c.key, c.label, (DATA[c.key] || []).length);
  });
  sb.innerHTML = html;
  function btn(href, label, cnt) {
    return '<button class="navbtn" data-href="' + href + '"><span>' + label + "</span>" +
      (cnt != null ? '<span class="cnt">' + cnt + "</span>" : "") + "</button>";
  }
  $$(".navbtn", sb).forEach(function (b) {
    b.addEventListener("click", function () { location.hash = b.getAttribute("data-href"); });
  });
}
function markActive(hash) {
  $$(".navbtn").forEach(function (b) {
    var href = b.getAttribute("data-href");
    var active = href === hash || (href !== "#/" && hash.indexOf(href) === 0);
    b.setAttribute("aria-current", active ? "true" : "false");
  });
  $("#sidebar").classList.remove("open");
}

/* ---------------- router ---------------- */
window.addEventListener("hashchange", route);
function route() {
  var h = location.hash || "#/";
  var parts = h.replace(/^#\//, "").split("/");
  markActive("#/" + (parts[0] || ""));
  if (parts[0] === "" ) viewDashboard();
  else if (parts[0] === "diagrams") viewDiagramList();
  else if (parts[0] === "diagram" && parts[1]) viewDiagram(parts[1]);
  else if (parts[0] === "catalog" && parts[1]) viewCatalog(parts[1]);
  else if (parts[0] === "record" && parts[1]) viewRecord(parts[1]);
  else if (parts[0] === "search") viewSearch(decodeURIComponent(parts.slice(1).join("/") || ""));
  else if (parts[0] === "legend") viewLegend();
  else if (parts[0] === "textindex") viewTextIndex();
  else viewDashboard();
  $("#main").focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

/* ---------------- dashboard ---------------- */
function viewDashboard() {
  var c = DATA.counts || {};
  var st = {};
  (DATA.flows || []).forEach(function (f) { st[f.status] = (st[f.status] || 0) + 1; });
  var html = '<h1>أطلس مسارات مايكرو</h1>' +
    '<div class="card">' + chip("IMPLEMENTED") + " خرائط المسارات من الفكرة إلى الإغلاق، مبنية على كود <b>main</b> الفعلي لا على الوعود. " +
    "المخططات تفاعلية: كبّر، حرّك، وانقر أي عقدة لرؤية تفاصيلها وأدلتها." +
    '<div class="field" style="margin-top:8px"><span class="lbl">الالتزام:</span> الالتزام النافذ: ' +
    "كل جملة تحمل مصدرها (مسار ملف أو اسم اختبار)، والحالة من مفردات ثابتة، والمخطط للمستقبل لا يُرسم كأنه منفذ أبدًا.</div></div>";
  html += '<div class="grid stats">' + stat(c.flows, "مسار مستخدم") + stat(c.flow_steps, "خطوة موثقة") +
    stat(c.screens, "شاشة") + stat(c.features, "قدرة") + stat(c.services, "خدمة") + stat(c.entities, "كيان") +
    stat(c.states, "حالة") + stat(c.transitions, "انتقال") + stat(c.scenarios, "سيناريو تحقق") +
    stat(c.gaps, "فجوة مسجلة") + stat(c.decisions, "قرار") + stat(c.traceability, "سطر تتبع") +
    stat(c.diagrams, "مخططًا") + stat(c.diagram_nodes, "عقدة مخطط") + "</div>";
  html += '<div class="card"><h2>توزيع حالات المسارات</h2><div>' +
    Object.keys(st).map(function (k) { return chip(k) + " " + st[k] + " مسارًا"; }).join(" · ") + "</div></div>";
  html += '<div class="card"><h2>ابدأ من هنا</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">' +
    dcard("DGM-01", "خريطة النظام", "كيف يتركب مايكرو محليًا بلا شبكة") +
    dcard("DGM-04", "الشاشات والتنقل", "من أي زر تبدأ كل نية") +
    dcard("DGM-18", "عربون → تسليم → متبقٍ", "المسار المالي الأهم (١٠٠/٢٠/٨٠)") +
    dcard("DGM-09", "آلة حالة الطلب", "كل حالة وانتقال بحارسه") +
    dcard("DGM-25", "الفجوات والتناقضات", "ما ينقص وما يتعارض") +
    dcard("DGM-26", "المستقبل المخطط", "ما هو عقد فقط ولا كود") +
    "</div></div>";
  html += '<div class="card"><h2>الحدود المالية الخمسة (محققة في الكود)</h2><ol>' +
    "<li>التحصيل ليس ربحًا.</li><li>الدَّين ليس كاشًا.</li><li>الشراء ليس تكلفة بيع حتى الاستهلاك.</li>" +
    "<li>مال المالك منفصل عن المصروف والإيراد.</li><li>المجهول لا يصبح صفرًا أبدًا.</li></ol></div>";
  html += '<div class="card"><h2>بيانات التحليل</h2>' + metaRows() + "</div>";
  $("#main").innerHTML = html;
  bindLinks($("#main"));
}
function stat(v, l) { return '<div class="stat"><b>' + (v || 0) + "</b><span>" + l + "</span></div>"; }
function dcard(id, title, desc) {
  return '<div class="card" style="cursor:pointer" data-id="' + id + '"><b>' + esc(title) + "</b>" +
    chip("IMPLEMENTED") + '<div style="font-size:12px;color:var(--mut)">' + esc(desc) + " — " + id + "</div></div>";
}
function metaRows() {
  return '<div class="field"><span class="lbl">المستودع:</span><span class="evi">' + esc(M.repository) + " (" + esc(M.branch) + ")</span></div>" +
    '<div class="field"><span class="lbl">الالتزام:</span><span class="evi">' + esc(M.commit_sha) + "</span></div>" +
    '<div class="field"><span class="lbl">تاريخ الالتزام:</span>' + esc(M.commit_date) + "</div>" +
    '<div class="field"><span class="lbl">تاريخ التحليل:</span>' + esc(M.analysis_date) + " (" + esc(M.analysis_timezone) + ")</div>" +
    '<div class="field"><span class="lbl">شجرة العمل:</span>' + esc(M.working_tree) + "</div>" +
    '<div class="field"><span class="lbl">النطاق:</span>' + esc(M.analysis_scope) + "</div>";
}

/* ---------------- diagrams ---------------- */
var CAT_AR = { system: "النظام", actors: "الفاعلون", domain: "المجال", navigation: "التنقل", swimlane: "ممرات السباحة", state: "آلات الحالات", blueprint: "المخطط الخدمي", critical: "التدفقات الحرجة", crossflow: "تقاطع المسارات", gap: "الفجوات", future: "المستقبل" };
function viewDiagramList() {
  var html = "<h1>أطلس المخططات — " + (DATA.diagrams || []).length + " مخططًا مترابطًا</h1>";
  html += '<div class="card">كل مخطط ذاتي الاحتواء يعمل بلا إنترنت: كبّر بعجلة الفأرة أو إصبعيك، حرّك بالسحب، انقر أي عقدة لتفاصيلها وأدلتها. ابدأ بخريطة النظام ثم انزل للتفاصيل.</div>';
  var cats = {};
  (DATA.diagrams || []).forEach(function (d) { (cats[d.category] = cats[d.category] || []).push(d); });
  Object.keys(cats).forEach(function (cat) {
    html += "<h2>" + (CAT_AR[cat] || cat) + "</h2>" + '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">';
    cats[cat].forEach(function (d) {
      html += '<div class="card" style="cursor:pointer" data-id="' + d.id + '"><b>' + esc(d.title_ar) + "</b>" +
        '<div class="evi">' + esc(d.id + " · " + d.title_en) + "</div>" +
        '<div style="font-size:12px;color:var(--mut)">' + esc(d.desc_ar).slice(0, 140) + "…</div></div>";
    });
    html += "</div>";
  });
  $("#main").innerHTML = html;
  $$("#main .card[data-id]").forEach(function (c) {
    c.addEventListener("click", function () { location.hash = "#/diagram/" + c.getAttribute("data-id"); });
  });
}

function viewDiagram(id) {
  var d = null;
  (DATA.diagrams || []).forEach(function (x) { if (x.id === id) d = x; });
  if (!d) { $("#main").innerHTML = '<div class="empty">مخطط غير موجود</div>'; return; }
  var idx = DATA.diagrams.indexOf(d);
  var nodes = (DATA.diagram_nodes || []).filter(function (n) { return n.diagram === id; });
  var html = '<span class="backlink" data-id="#/diagrams">→ كل المخططات</span>' +
    "<h1>" + esc(d.title_ar) + ' <span class="tocat">' + esc(d.id + " · " + d.title_en) + "</span></h1>" +

function initPanZoom(wrap) {
  var svg = wrap.querySelector("svg");
  if (!svg) return;
  var vb = (svg.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(Number);
  var orig = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
  var cur = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
  function apply() { svg.setAttribute("viewBox", cur.x + " " + cur.y + " " + cur.w + " " + cur.h); }
  function zoomAt(f, cx, cy) {
    var nw = Math.min(Math.max(cur.w * f, orig.w / 12), orig.w * 4);
    var k = nw / cur.w;
    cur.x = cx - (cx - cur.x) * k;
    cur.y = cy - (cy - cur.y) * k;
    cur.w = nw; cur.h = cur.h * k;
    apply();
  }
  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = wrap.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    zoomAt(e.deltaY < 0 ? 0.88 : 1.14, cur.x + cur.w * px, cur.y + cur.h * py);
  }, { passive: false });
  var ptrs = new Map(), last = null;
  wrap.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".dg-node") && ptrs.size === 0) return; // let node clicks work first
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = { x: e.clientX, y: e.clientY };
    wrap.setPointerCapture && wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!ptrs.has(e.pointerId)) return;
    if (ptrs.size === 1) {
      var r = wrap.getBoundingClientRect();
      var dx = (e.clientX - last.x) / r.width * cur.w;
      var dy = (e.clientY - last.y) / r.height * cur.h;
      cur.x -= dx; cur.y -= dy; apply();
      last = { x: e.clientX, y: e.clientY };
    } else if (ptrs.size === 2) {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      var pts = Array.from(ptrs.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (last && last.d) {
        var r2 = wrap.getBoundingClientRect();
        var cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
        var px2 = (cx - r2.left) / r2.width, py2 = (cy - r2.top) / r2.height;
        zoomAt(last.d / d, cur.x + cur.w * px2, cur.y + cur.h * py2);
      }
      last = { d: d };
    }
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    wrap.addEventListener(ev, function (e) { ptrs.delete(e.pointerId); if (ptrs.size === 0) last = null; });
  });
  wrap.addEventListener("click", function (e) {
    var node = e.target.closest(".dg-node");
    if (!node) return;
    var ref = node.getAttribute("data-ref");
    var nid = node.getAttribute("data-id");
    if (ref && REC.get(ref)) openDetails(ref);
    else openNodeDetails(nid);
  });
  var fit = function () { cur = { x: orig.x, y: orig.y, w: orig.w, h: orig.h }; apply(); };
  $("#zin") && $("#zin").addEventListener("click", function () { zoomAt(0.8, cur.x + cur.w / 2, cur.y + cur.h / 2); });
  $("#zout") && $("#zout").addEventListener("click", function () { zoomAt(1.25, cur.x + cur.w / 2, cur.y + cur.h / 2); });
  $("#zfit") && $("#zfit").addEventListener("click", fit);
}

function viewSearch(q) {
  q = (q || "").trim().toLowerCase();
  var html = "<h1>نتائج البحث" + (q ? ' — «' + esc(q) + "»" : "") + "</h1>";
  if (!q) { $("#main").innerHTML = html + '<div class="empty">اكتب كلمة في حقل البحث أعلى الصفحة.</div>'; return; }
  var results = [];
  REC.forEach(function (e, id) {
    if (e.coll.key === "diagram_nodes" || e.coll.key === "flow_steps") return;
    var r = e.rec;
    var name = (r.name_ar || "") + " " + (r.title_ar || "") + " " + (r.label_ar || "") + " " + (r.name_en || "") + " " + (r.title_en || "") + " " + (r.title || "");
    var hay = (id + " " + name + " " + (r.status || "") + " " + JSON.stringify(r)).toLowerCase();
    if (hay.indexOf(q) !== -1) results.push({ id: id, e: e, score: (id.toLowerCase().indexOf(q) === 0 ? 0 : (name.toLowerCase().indexOf(q) !== -1 ? 1 : 2)) });
  });
  results.sort(function (a, b) { return a.score - b.score || a.id.localeCompare(b.id); });
  html += '<div class="card">عدد النتائج: ' + results.length + (results.length > 300 ? " (أول 300 معروضة)" : "") + "</div>";
  html += "<table><tr><th>النوع</th><th>المعرف</th><th>الاسم</th><th>الحالة</th></tr>";
  results.slice(0, 300).forEach(function (x) {
    var r = x.e.rec;
    var nm = r.name_ar || r.title_ar || r.label_ar || r.name_en || r.title_en || r.title || r.id;
    var st = r.status || r.implementation_status || "";
    html += "<tr><td>" + esc(x.e.coll.one) + "</td><td>" + linkTo(x.id, x.id) + "</td><td>" + esc(nm) + "</td><td>" + (st ? chip(st) : "—") + "</td></tr>";
  });
  html += "</table>";
  $("#main").innerHTML = html;
  bindLinks($("#main"));
}

function viewLegend() {
  var shapes = [
    ["start", "بداية أو نهاية (مستطيل مدوّر)"], ["action", "فعل مستخدم أو نظام (مستطيل)"],
    ["decision", "قرار/بوابة (معين)"], ["io", "إدخال أو إخراج (متوازي أضلاع)"],
    ["store", "مخزن بيانات/تخزين (أسطوانة)"], ["sub", "عملية فرعية مرتبطة (مزدوج الحدود)"],
    ["ext", "فاعل خارجي: مورد/توصيل/غيره (متقطع)"], ["event", "مُطلِق/حدث (دائرة)"],
    ["doc", "مستند: وصل/تقرير/كشف (شكل مستند)"]
  ];
  var sample = {};
  shapes.forEach(function (s) { sample[s[0]] = sampleSvg(s[0]); });
  var h = "<h1>دليل الرموز والقراءة</h1><div class='card'>";
  h += "<h3>أشكال العقد</h3><div class='legend-grid'>";
  shapes.forEach(function (s) { h += '<div class="legend-item">' + sample[s[0]] + "<span>" + s[1] + "</span></div>"; });
  h += "</div>";
  h += "<h3>أنواع الأسهم</h3><ul>" +
    '<li><svg width="70" height="14"><path d="M66 7 H8" stroke="#231f1a" stroke-width="2" marker-end="url(#lg1)"/><defs><marker id="lg1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#231f1a"/></marker></defs></svg> سهم متصل = تدفق تحكم</li>' +
    '<li><svg width="70" height="14"><path d="M66 7 H8" stroke="#6f6a60" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lg2)"/><defs><marker id="lg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6f6a60"/></marker></defs></svg> سهم متقطع = علاقة بيانات/مرجع</li>' +
    '<li><svg width="70" height="14"><path d="M66 7 H8" stroke="#b3452f" stroke-width="2.4" marker-end="url(#lg3)"/><defs><marker id="lg3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3452f"/></marker></defs></svg> حافة حمراء = فشل/استثناء/تعارض</li></ul>';
  h += "<h3>شارات الحالة (نص + لون معًا دائمًا)</h3><div>" +
    chip("IMPLEMENTED") + " موجود ومنفذ في main · " + chip("PARTIALLY_IMPLEMENTED") +
    " منفذ جزئيًا · " + chip("PLANNED_OR_CONCEPTUAL") + " مخطط/عقدي فقط · " + chip("NOT_FOUND") +
    " غير موجود · " + chip("CONFLICTING") + " متعارض مع الوثائق</div>";
  h += "<h3>قواعد القراءة</h3><ol><li>تدفق التحكم من اليمين إلى اليسار (RTL).</li>" +
    "<li>كل عقدة تحمل شكلًا ونصًا وشارة حالة — اللون وحده لا يحمل معنى أبدًا.</li>" +
    "<li>انقر أي عقدة لفتح تفاصيلها وأدلتها (مسار ملف أو اسم اختبار).</li>" +
    "<li>المخططات للمستقبل (DGM-26) معزولة عن الحاضر ولا تُرسم كأنها منفذة.</li></ol></div>";
  $("#main").innerHTML = h;
}
function sampleSvg(kind) {
  var st = { fill: "#eaf3ec", stroke: "#2f7d4f" };
  var w = 64, h = 34, x = 4, y = 4;
  if (kind === "start") return sh('<rect x="4" y="4" width="56" height="26" rx="13" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/>');
  if (kind === "action") return sh('<rect x="4" y="4" width="56" height="26" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/>');
  if (kind === "decision") return sh('<polygon points="32,1 61,17 32,33 3,17" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/>');
  if (kind === "io") return sh('<polygon points="12,4 64,4 52,30 0,30" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/>');
  if (kind === "store") return sh('<path d="M4 10 a28 6 0 0 1 56 0 v14 a28 6 0 0 1 -56 0 z" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/><path d="M4 10 a28 6 0 0 0 56 0" fill="none" stroke="' + st.stroke + '" stroke-width="2"/>');
  if (kind === "sub") return sh('<rect x="4" y="4" width="56" height="26" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/><rect x="8" y="8" width="48" height="18" fill="none" stroke="' + st.stroke + '"/>');
  if (kind === "ext") return sh('<rect x="4" y="4" width="56" height="26" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2" stroke-dasharray="6 3"/>');
  if (kind === "event") return sh('<circle cx="32" cy="17" r="12" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/><circle cx="32" cy="17" r="3" fill="' + st.stroke + '"/>');
  if (kind === "doc") return sh('<path d="M4 4 h40 l12 12 v14 h-52 z" fill="' + st.fill + '" stroke="' + st.stroke + '" stroke-width="2"/>');
  return "";
  function sh(inner) { return '<svg width="' + 66 + '" height="38" viewBox="0 0 66 38" aria-hidden="true">' + inner + "</svg>"; }
}
function viewTextIndex() {
  var h = "<h1>الفهرس النصي (وصولية)</h1>";
  h += '<div class="card">فهرس كامل قابل للبحث بمتصفحك (Ctrl+F). كل معرف قابل للنقر.</div>';
  h += "<h2>المسارات</h2><table><tr><th>المعرف</th><th>الاسم العربي</th><th>الاسم الإنجليزي</th><th>الحالة</th></tr>";
  (DATA.flows || []).forEach(function (f) {
    h += "<tr><td>" + linkTo(f.id, f.id) + "</td><td>" + esc(f.name_ar) + "</td><td>" + esc(f.name_en) + "</td><td>" + chip(f.status) + "</td></tr>";
  });
  h += "</table><h2>الشاشات</h2><table><tr><th>المعرف</th><th>العنوان</th><th>المسار</th></tr>";
  (DATA.screens || []).forEach(function (s) {
    h += "<tr><td>" + linkTo(s.id, s.id) + "</td><td>" + esc(s.title_ar) + "</td><td><span class='evi'>" + esc(s.route) + "</span></td></tr>";
  });
  h += "</table><h2>المخططات</h2><table><tr><th>المعرف</th><th>العنوان</th><th>الفئة</th></tr>";
  (DATA.diagrams || []).forEach(function (d) {
    h += "<tr><td>" + linkTo(d.id, d.id) + "</td><td>" + esc(d.title_ar) + "</td><td>" + esc(CAT_AR[d.category] || d.category) + "</td></tr>";
  });
  h += "</table>";
  $("#main").innerHTML = h;
  bindLinks($("#main"));
}

/* ---------------- meta panel + boot ---------------- */
function metaPanel() {
  $("#metaPanel").innerHTML = '<div class="meta-card"><button class="closebtn" aria-label="إغلاق">✕</button>' +
    "<h2>بيانات التحليل</h2>" + metaRows() +
    '<h3>مفردات الحالة</h3><div>' + Object.keys(STATUS_AR).map(function (k) { return chip(k); }).join(" ") + "</div>" +
    '<h3>حجم الأطلس</h3><div class="evi">' + JSON.stringify(DATA.counts) + "</div></div>";
  $("#metaPanel").hidden = false;
  $("#metaPanel .closebtn").addEventListener("click", function () { $("#metaPanel").hidden = true; });
}
$("#metaBtn").addEventListener("click", metaPanel);
$("#navToggle").addEventListener("click", function () { $("#sidebar").classList.toggle("open"); });
$("#searchInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    location.hash = "#/search/" + encodeURIComponent(this.value.trim());
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { $("#details").hidden = true; $("#metaPanel").hidden = true; }
});
nav();
route();

</script>
